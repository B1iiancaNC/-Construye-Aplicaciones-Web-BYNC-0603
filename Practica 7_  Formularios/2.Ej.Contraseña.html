<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario para contrasenas</title>
<!--BIANCA YURIDIA NEVAREZ CARVAJAL-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css"> <!--Herramienta externa para poder adornar la pagina con iconos-->
</head> 
<body> 
<h2>Formulario para contrasenas</h2> 
<!--Formulario para el login que oculta la contrasena-->
<form action="" method="post"> <!--Preparamos la zona donde el usuario metera datos-->
Ingresa tu usuario: <!--Indicamos a la persona mediante texto que esperamos que haga-->
<input type="text" name="usuario"> <!--Creamos la caja en blanco donde va a escribir. La identificamos internamente como "usuario"-->
Ingresa tu contrasena: <!--Volvemos a indicar con texto el siguiente dato que necesitamos-->
<input type="password" name="pass"> <!--Creamos una caja especial que oculta el texto mientras escribes. La identificamos como "pass"-->
<br> <!--Hacemos un salto de linea, para que los botones queden bien acomodados abajo-->
<input type="submit" value="enviar"> <!--Creamos el boton que atrapa la informacion y la manda. Le ponemos"enviar"-->
<input type="reset" value="borrar"> <!--Agregamos un segundo boton que sirve para limpiar las cajas por si la persona se equivoca-->
</form> 

</body>
</html>
