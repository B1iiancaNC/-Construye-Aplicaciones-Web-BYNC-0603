<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con campos ocultos</title>
<!--BIANCA YURIDIA NEVAREZ CARVAJAL-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css"> <!--Herramienta externa para poder adornar la pagina con iconos-->
</head> 
<body> 
<h2>Formulario con campos ocultos</h2> 
<!--Formulario que guarda un dato sin que el usuario lo vea en la pantalla-->
<form action="" method="post"> <!--Preparamos la zona donde el usuario metera datos-->
<input type="hidden" name="hora" value="3:30"> <!--Creamos un campo invisible que guarda la hora por nosotros. Lo identificamos como "hora"-->
Ingresa tu nombre: <!--Indicamos a la persona mediante texto que esperamos que haga-->
<input type="text" name="nombre"> <!--Creamos la caja en blanco donde va a escribir. La identificamos internamente como "nombre"-->
<br> <!--Hacemos un salto de linea, para que los botones queden bien acomodados abajo-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> <!--Creamos el boton que atrapa la informacion y la manda. Usamos la etiqueta button para poder incluir un icono-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!--Agregamos un segundo boton que sirve para limpiar la caja, tambien con su propio icono-->
</form> 

</body>
</html>
