<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejemplo basico</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css"> <!--Herramienta externa para poder adornar la pagina con iconos-->
</head> 
<body> 
<h2>Ejemplo basico</h2> 
<!-- Formulario basico para pedir el nombre del usuario-->
<form action="" method="post"> <!--Preparamos la zona donde el usuario metera datos. El metodo "post" ayuda a que la informacion viaje de forma mas segura-->
Ingresa tu nombre: <!--Indicamos a la persona mediante texto que esperamos que haga-->
<input type="text" name="nombre" size="20"> <!--Creamos la caja en blanco donde va a escribir. La identificamos internamente como "nombre" y le damos tamaño-->
<br> <!--Hacemos un salto de linea, como si presionaramos "Enter", para que el boton quede bien acomodado abajo. -->
<input type="submit" value="enviar"> <!--Creamos el boton que atrapa la informacion y la manda. Le ponemos la palabra "enviar"-->
</form> <!--Terminamos la zona del formulario, indicando que ya no pediremos mas datos en esta seccion-->

</body>
</html>
