<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios con checkbox</title>
<!--BIANCA YURIDIA NEVAREZ CARVAJAL-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css"> <!--Herramienta externa para poder adornar la pagina con iconos-->
</head> 
<body> 
<h2>Formularios con checkbox</h2> 
<!--Formulario para que el usuario pueda elegir multiples opciones a la vez-->
<form action="" method="post"> <!--Preparamos la zona donde el usuario metera datos-->
Ingresa tu nombre: <!--Indicamos a la persona mediante texto que esperamos que haga-->
<input type="text" name="nombre"> <!--Creamos la caja en blanco donde va a escribir. La identificamos internamente como "nombre"-->
<br> <!--Hacemos un salto de linea-->
Selecciona los lenguajes que conozcas: <!--Volvemos a indicar con texto lo que necesitamos que elija-->
<br> <!--Hacemos un salto de linea-->
<input type="checkbox" name="Java">Java <br> <!--Creamos una casilla de verificacion para la opcion Java y saltamos de linea-->
<input type="checkbox" name="Python"> Python <br> <!--Creamos una casilla para Python y saltamos de linea-->
<input type="checkbox" name="C#">C# <br> <!--Creamos una casilla para C# y saltamos de linea-->
<input type="checkbox" name="Flutter"> Flutter <br> <!--Creamos una casilla para Flutter y saltamos de linea-->
</form> 

</body>
</html>
